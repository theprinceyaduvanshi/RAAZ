<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a12">
<meta name="description" content="RAAZ — Your Chats Is Fully RAAZ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="./icon.svg?v=15" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png?v=15">

<link rel="manifest" href="./manifest.json?v=15">
<title>RAAZ — Your Chats Is Fully RAAZ</title>
</head>
<body>
<div id="splash" class="splash" aria-label="RAAZ loading">
  <div class="splash-orb orb-a"></div><div class="splash-orb orb-b"></div>
  <div class="splash-logo"><img src="./icon.svg?v=15" alt="RAAZ"></div>
  <div class="splash-title">RAAZ</div>
  <div class="splash-tagline">Your Chats Is Fully RAAZ</div>
  <div class="splash-line"><span></span></div>
</div>
<div id="app"></div>
<div id="toast-root" aria-live="polite"></div>
<script>
(async()=>{
  const v="15";
  if(localStorage.getItem("raaz-cache-clean")!==v){
    localStorage.setItem("raaz-cache-clean",v);
    try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch(e){}
    try{const regs=await navigator.serviceWorker?.getRegistrations?.();await Promise.all((regs||[]).map(r=>r.unregister()))}catch(e){}
    location.reload(); return;
  }
  window.addEventListener('load',()=>setTimeout(()=>document.getElementById('splash')?.classList.add('hide'),1400));
})();
</script>
<script type="module" src="./app.js?v=15"></script>
<script>window.addEventListener('load',()=>{if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js?v=15').catch(()=>{})}})</script>
</body>
</html>
